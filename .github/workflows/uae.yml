name: UAE BOX OFFICE

on:
  workflow_dispatch:        # Manual trigger

concurrency:
  group: uae-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mode: [daily, advance]

    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd uae
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests curl_cffi aiohttp beautifulsoup4 tabulate
          fi

      - name: Run UAE Box Office Aggregator
        run: |
          cd uae
          MODE="${{ matrix.mode }}"

          echo "🎬 Running uae.py with mode $MODE"

          for i in {1..5}; do
            echo "Attempt $i"
            if python uae.py --mode "$MODE"; then
              echo "✅ UAE Scraper finished successfully"
              break
            fi
            echo "❌ Scraper failed. Retrying in 10 seconds..."
            sleep 10
          done

      - name: Commit & Push Scraper Data
        run: |
          cd uae
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          git rm -rf --cached __pycache__ 2>/dev/null || true

          git add data/

          git commit -m "UAE ${{ matrix.mode }} update ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "No changes to commit"
          git push
