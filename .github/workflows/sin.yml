name: SINGAPORE

on:
  workflow_dispatch:

# 🔥 Prevent overlapping runs
concurrency:
  group: singapore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        mode: [daily, advance]

    env:
      REPO: cinenationbo/singapore

    steps:
      # 🔒 Clone Private Repository
      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git .

      # 🐍 Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 📦 Install dependencies
      - name: Install dependencies
        run: |
          cd singapore
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 urllib3
          fi

      # 🎬 Run Singapore Box Office Tracker
      - name: Run Singapore Scraper
        run: |
          cd singapore
          MODE="${{ matrix.mode }}"

          echo "🎬 Running singapore.py with mode: $MODE"

          for i in {1..3}; do
            echo "Attempt $i..."

            if python singapore.py --mode "$MODE"; then
              echo "✅ Scraper completed successfully"
              break
            fi

            echo "❌ Scraper run failed. Retrying in 5 seconds..."
            sleep 5
          done

      # 💾 Commit & Push Data
      - name: Commit and Push Data
        run: |
          cd singapore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "[skip ci] Singapore ${{ matrix.mode }} update ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            
            for i in {1..5}; do
              echo "Push attempt $i..."
              git pull --rebase origin main || true
              if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git; then
                echo "✅ Data successfully pushed to repository"
                break
              fi
              echo "❌ Push failed, retrying in 5 seconds..."
              sleep 5
            done
          fi
