name: korean  usa

on:
  workflow_dispatch:

concurrency:
  group: jana-${{ github.ref }}
  cancel-in-progress: true

# 🌍 GLOBAL ENV — available to all jobs
env:
  REPO: "cinenationbo/usa"
  MOVIE_ID: "246701"
  RELEASE_DATE: "2026-08-06"

jobs:
  scrape:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1]

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Private Repo
        run: |
          git clone --depth=1 \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git usa

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('usa/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-pip-

      - name: Install dependencies
        working-directory: usa
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute TARGET_DATE
        shell: bash
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          BASE_DATE="$TODAY"

          if [[ "$TODAY" < "$RELEASE_DATE" ]]; then
            BASE_DATE="$RELEASE_DATE"
          fi

          TARGET_DATE=$(date -u \
            -d "$BASE_DATE +${{ matrix.shard }} day" \
            +"%Y-%m-%d")

          echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"

          echo "🎬 MOVIE_ID=$MOVIE_ID"
          echo "📅 TODAY=$TODAY"
          echo "📅 TARGET_DATE=$TARGET_DATE"
          echo "🧩 SHARD=${{ matrix.shard }}"

      - name: Run scraper
        working-directory: usa
        run: |
          echo "🎬 MOVIE_ID=$MOVIE_ID"
          echo "📅 TARGET_DATE=$TARGET_DATE"

          python usa.py

      - name: Commit & Push
        working-directory: usa
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "🟡 No changes"
            exit 0
          fi

          git add -A
          git commit -m "[skip ci] shard ${{ matrix.shard }} $TARGET_DATE ($(date -u +'%H:%M:%S'))"

          for i in {1..5}; do
            echo "🔁 Push attempt $i/5..."

            git rebase --abort 2>/dev/null || true
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "✅ Shard ${{ matrix.shard }} pushed"
                exit 0
              fi
            else
              echo "❌ Rebase conflict"
              git rebase --abort 2>/dev/null || true
            fi

            WAIT_TIME=$((i * 5))
            echo "⚠️ Retry in ${WAIT_TIME}s..."
            sleep "$WAIT_TIME"
          done

          echo "❌ Failed after 5 attempts"
          exit 1


  combine:
    needs: scrape
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Latest Private Repo
        run: |
          git clone --depth=1 \
            https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git usa

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-pip-${{ hashFiles('usa/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-pip-

      - name: Install dependencies
        working-directory: usa
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run combiner
        working-directory: usa
        run: |
          echo "📊 Combining data..."
          echo "🎬 MOVIE_ID=$MOVIE_ID"

          python combiner.py

      - name: Commit & Push Combined
        working-directory: usa
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "🟡 No combined changes"
            exit 0
          fi

          git add -A
          git commit -m "[skip ci] combined $(date -u +'%Y-%m-%d %H:%M:%S')"

          for i in {1..5}; do
            echo "🔁 Combined push attempt $i/5..."

            git rebase --abort 2>/dev/null || true
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "✅ Combined data pushed"
                exit 0
              fi
            else
              echo "❌ Rebase conflict"
              git rebase --abort 2>/dev/null || true
            fi

            WAIT_TIME=$((i * 5))
            echo "⚠️ Retry in ${WAIT_TIME}s..."
            sleep "$WAIT_TIME"
          done

          echo "❌ Failed after 5 attempts"
          exit 1
