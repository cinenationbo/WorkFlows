name: USA Advance Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: usa-advance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      REPO: cinenationbo/usav2

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone Private Repo
        run: |
          git clone --depth=1 https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('usav2/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd usav2
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests aiohttp aiohttp-retry tqdm
          fi

      - name: Run USA Advance Scraper
        run: |
          cd usav2
          python usa-advance.py

      - name: Commit & Push Output
        run: |
          cd usav2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain) ]]; then
            git add advance/
            git commit -m "update advance  data ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

            for i in {1..5}; do
              echo "🔁 Push attempt $i..."
              git pull --rebase origin main && \
              git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ env.REPO }}.git && break
              echo "⚠️ Push failed. Retrying in $((i*5))s..."
              sleep $((i*5))
            done

            echo "✅ Advance CSV updates pushed successfully"
          else
            echo "🟡 No CSV changes detected"
          fi
